<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Currency Converter</h1>
      <p>Convert an amount at today’s exchange rate.</p>
    </header>

    <section class="card">
      <form id="form">
        <label>Amount
          <input id="amount" type="number" min="0" step="any" value="100" required>
        </label>
        <div class="row three">
          <label>From <select id="from"></select></label>
          <button type="button" id="swap" class="ghost" aria-label="Swap currencies">⇄</button>
          <label>To <select id="to"></select></label>
        </div>
        <button id="go">Convert</button>
      </form>
      <div id="result" aria-live="polite"></div>
    </section>

    <footer>Built with <a href="https://apiverve.com/marketplace/exchangerate">Exchange Rate API</a> from APIVerve</footer>
  </main>
</body>
</html>
